<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="author" content="Bruno Araujo">
    <title>Exercicio 05</title>
    <style>
        p {
            margin: 50px 0;
        }

        .link1 {
            text-decoration: none;
        }

        .link2 {
            text-decoration: overline;
        }

        .link2:active {
            text-decoration: line-through;
        }

        .link2:visited {
            text-decoration: underline;
        }

        .link3 {
            color: orange;
            text-decoration: none;
        }

        .link3:hover {
            color: green;
            text-decoration: underline;
        }

        .link4 {
            border: 2px solid blue;
            background-color: black;
            color: white;
            padding: 10px;
            text-decoration: none;
        }

        .link4:hover {
            border: 2px dotted black;
            background-color: white;
            color: black;
        }

        .link5 {
            color: red;
            text-decoration: none;
        }

        .link5:visited {
            color: orange;
            font-style: italic;
            font-weight: bold;
        }

        .link5:hover {
            text-decoration: underline;
        }

        .link5:active {
            color: yellow;
        }
    </style>
</head>

<body>
    <p><a class="link1" href="#">Link Exemplo 1</a></p>
    <p><a class="link2" href="#">Link Exemplo 2</a></p>
    <p><a class="link3" href="#">Link Exemplo 3</a></p>
    <p><a class="link4" href="#">Link Exemplo 4</a></p>
    <p><a class="link5" href="#">Link Exemplo 5</a></p>
</body>

</html>
